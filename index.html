<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web SSH Terminal</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        #terminal-container {
            width: 100%;
            height: 80vh;
            overflow-y: scroll;
            border: 1px solid #444444;
            padding: 10px;
            background-color: #2c2c2c;
        }
        .input-section {
            margin-top: 10px;
        }
        input[type="text"] {
            width: 90%;
            padding: 5px;
            font-family: 'Courier New', monospace;
            border: none;
            border-bottom: 1px solid #333333;
            outline: none;
        }
        button {
            padding: 5px 15px;
            background-color: #6d4aff; /* Matches Lumo's purple */
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
        }
        button:hover {
            background-color: #4b39c3;
        }
    </style>
</head>
<body>
    <div id="terminal-container"></div>
    <div class="input-section">
        <input id="commandInput" type="text" placeholder="Enter SSH command (e.g., ssh username@host)" />
        <button id="sendCommand">Run Command</button>
    </div>

    <script>
        const terminalContainer = document.getElementById('terminal-container');
        const commandInput = document.getElementById('commandInput');
        const sendButton = document.getElementById('sendCommand');

        // Note: This JS connects to a WebSocket server running on a backend node/Python/Golang
        // Actual SSH logic happens on the backend. Here is stub logic for demo purposes only.
        let connectionEstablished = false;

        function logMessage(msg) {
            const p = document.createElement('p');
            p.innerText = msg;
            terminalContainer.appendChild(p);
            terminalContainer.scrollTop = terminalContainer.scrollHeight;
        }

        sendButton.addEventListener('click', () => {
            const cmd = commandInput.value.trim();
            if (!cmd) return;

            // Replace with WebSocket.send(JSON.stringify({ command: cmd }));
            console.log('Simulated command:', cmd);

            // In real implementation:
            // socket.emit('execute_command', cmd);
            logMessage(`You typed: ${cmd}`);
        });
    </script>
</body>
</html>
